name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Build APK with Android Build Tools
        working-directory: ${{ github.workspace }}
        run: |
          echo "Current directory: $(pwd)"
          ls -la

          mkdir -p build/classes build/gen build/outputs

          PLATFORM=$ANDROID_HOME/platforms/android-34
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0

          echo "Using Build Tools: $BUILD_TOOLS"
          echo "Using Platform: $PLATFORM"

          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar

          javac -d build/classes \
            -classpath $PLATFORM/android.jar \
            InputMonitorService.java

          $BUILD_TOOLS/d8 --output build/ $(find build/classes -name "*.class")

          $BUILD_TOOLS/aapt package -f \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar \
            -F build/outputs/app-unsigned.apk \
            build/

          keytool -genkey -v -keystore build/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          $BUILD_TOOLS/apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --out build/outputs/EyeSpy-debug.apk \
            build/outputs/app-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeSpy-APK
          path: build/outputs/EyeSpy-debug.apk
