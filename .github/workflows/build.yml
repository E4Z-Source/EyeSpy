name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK with Android Build Tools
        run: |
          mkdir -p build/classes build/gen build/outputs

          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          PLATFORM=$(find $ANDROID_HOME/platforms -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)

          echo "Using Build Tools: $BUILD_TOOLS"
          echo "Using Platform: $PLATFORM"

          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar

          javac -d build/classes \
            -classpath $PLATFORM/android.jar \
            InputMonitorService.java

          if [ -f "$BUILD_TOOLS/d8" ]; then
            $BUILD_TOOLS/d8 --output build/ $(find build/classes -name "*.class")
          else
            $BUILD_TOOLS/dx --dex --output=build/classes.dex build/classes
          fi

          $BUILD_TOOLS/aapt package -f \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar \
            -F build/outputs/app-unsigned.apk \
            build/

          keytool -genkey -v -keystore build/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          $BUILD_TOOLS/apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --out build/outputs/EyeSpy-debug.apk \
            build/outputs/app-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeSpy-APK
          path: build/outputs/EyeSpy-debug.apk
