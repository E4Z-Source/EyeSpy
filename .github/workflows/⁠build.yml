name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Android Build Tools
        run: |
          mkdir -p build/classes build/gen build/outputs

          # Locate Android SDK tools
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          PLATFORM=$(find $ANDROID_HOME/platforms -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)

          echo "Using Build Tools: $BUILD_TOOLS"
          echo "Using Platform: $PLATFORM"

          # 1. Process Manifest and resources
          $BUILD_TOOLS/aapt package -f -m \
            -J build/gen \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar

          # 2. Compile Java source files
          javac -d build/classes \
            -classpath $PLATFORM/android.jar \
            InputMonitorService.java

          # 3. Convert bytecode to Android DEX format
          if [ -f "$BUILD_TOOLS/d8" ]; then
            $BUILD_TOOLS/d8 --output build/ $(find build/classes -name "*.class")
          else
            $BUILD_TOOLS/dx --dex --output=build/classes.dex build/classes
          fi

          # 4. Package resources and DEX into an unaligned APK
          $BUILD_TOOLS/aapt package -f \
            -M AndroidManifest.xml \
            -I $PLATFORM/android.jar \
            -F build/outputs/app-unsigned.apk \
            build/

          # 5. Sign the APK with a debug keystore for installation
          keytool -genkey -v -keystore build/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          $BUILD_TOOLS/apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --out build/outputs/EyeSpy-debug.apk \
            build/outputs/app-unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeSpy-APK
          path: build/outputs/EyeSpy-debug.apk
